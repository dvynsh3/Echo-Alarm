name: Build and release APK

# Runs when a tag like v1.6.0 is pushed. Builds the app and publishes a GitHub Release
# containing the APK, with the matching section of CHANGELOG.md as the release notes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.6.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already has the Android SDK; just accept its licences.
      - name: Accept Android SDK licences
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      # The projects ship without gradlew / the wrapper JAR, so install Gradle 8.9 directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Same signing key for every build, so each APK can be installed over the previous one.
      - name: Use the shared debug keystore
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Stamp version into the app
        run: |
          VER="${TAG#v}"
          IFS=. read -r MAJ MIN PAT <<< "$VER"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          echo "versionName=$VER versionCode=$CODE"
          sed -i -E "s/versionCode = [0-9]+/versionCode = $CODE/; s/versionName = \"[^\"]*\"/versionName = \"$VER\"/" app/build.gradle.kts
          grep -nE "versionCode|versionName" app/build.gradle.kts

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK and release notes
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/Echo-${TAG}.apk"
          fi
          # Release notes = the "## [vX.Y.Z]" section of CHANGELOG.md
          tr -d '\r' < CHANGELOG.md | awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' | sed '/^---$/d' > dist/notes.md
          if [ ! -s dist/notes.md ]; then echo "Release $TAG" > dist/notes.md; fi
          if [ ! -f "dist/Echo-${TAG}.apk" ]; then
            printf '\n> **No APK for this version:** it does not compile (see the next release for the fix).\n' >> dist/notes.md
          fi
          cat dist/notes.md

      - name: Publish GitHub Release
        run: |
          FILES=""
          [ -f "dist/Echo-${TAG}.apk" ] && FILES="dist/Echo-${TAG}.apk"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" $FILES --title "$TAG" --notes-file dist/notes.md --verify-tag --latest=false
